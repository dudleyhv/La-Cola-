name: Publicar lanzamiento destacado

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Enlace(s) al artículo del/de los lanzamiento(s). Para varios, sepáralos con comas'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lanzamiento:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install

      - name: Generar la ficha del lanzamiento
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_URL: ${{ inputs.url }}
        run: node scripts/generate-lanzamiento.mjs

      - name: Crear propuesta de cambio (Pull Request)
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Publicar lanzamiento(s) destacado(s)"
          title: "🚀 Lanzamiento(s) destacado(s) para revisar"
          body: |
            Estos lanzamientos se han generado a partir de las URL que pegaste al ejecutar el workflow:
            ${{ inputs.url }}

            Revisa el texto en `src/data/articulos.json` (los elementos nuevos, al final del archivo) y en `src/data/drops.json`. El primer enlace de la lista pasa a ser el destacado de portada. Si te convence, acepta esta propuesta (Merge) para publicarlo. Si alguna URL ha fallado (por ejemplo por bloqueo de la web de origen), aparecerá en el registro ("Actions" → esta ejecución → paso "Generar la ficha del lanzamiento") pero no habrá impedido que se procesen las demás.
          branch: auto/lanzamiento-manual
          delete-branch: true
          add-paths: src/data/*.json
