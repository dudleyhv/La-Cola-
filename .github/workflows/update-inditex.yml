name: Buscar tendencias Inditex

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-inditex:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install

      - name: Buscar productos de tendencia
        run: node scripts/generate-inditex.mjs

      - name: Crear propuesta de cambio (Pull Request)
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Actualizar tendencias Inditex"
          title: "🛍️ Productos de tendencia para revisar"
          body: |
            Este contenido lo ha generado el robot a partir de los sitemaps públicos de las marcas revisadas (empezando por Bershka), filtrado por las palabras clave de tendencia acordadas.

            Antes de aceptar (Merge) esta propuesta:
            1. Revisa cada producto y decide si de verdad merece la pena destacarlo.
            2. Si algún producto tiene `"imagen": null`, entra en "Files changed", abre `src/data/inditex.json`, y sustituye ese `null` por el enlace a una foto (puedes sacarla de la propia página del producto, en `url`).
            3. Guarda ese cambio en esta misma rama y luego pulsa "Merge".

            Este flujo NO se ejecuta solo — solo corre cuando tú pulsas "Run workflow" en la pestaña Actions.
          branch: auto/inditex-tendencias
          delete-branch: true
          add-paths: src/data/inditex.json
