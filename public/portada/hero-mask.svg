<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <mask id="cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
      <text
        x="800" y="490"
        text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="190"
        textLength="1360"
        lengthAdjust="spacingAndGlyphs"
        fill="#000000"
      >APOLO RADAR</text>
    </mask>
  </defs>
  <!-- Rectángulo que cubre TODA la pantalla; el mask solo deja "agujeros"
       transparentes con la forma de las letras, para que el vídeo se vea
       únicamente por dentro de ellas. -->
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff" mask="url(#cutout)"/>
</svg>
